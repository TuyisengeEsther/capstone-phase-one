<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Explorer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>


<body id="appBody" class="bg-black text-white min-h-screen flex flex-col transition-colors duration-300">

<!-- HEADER -->
<header id="appHeader" class="bg-zinc-900 border-b border-zinc-800 sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">

    <h1 class="text-xl font-bold">📚 Book Explorer</h1>

    <nav class="hidden md:flex gap-6">
      <a href="index.html" class="hover:text-gray-400">Home</a>
      <a href="favorite.html" class="hover:text-gray-400">Favorite</a>
      <a href="about.html" class="hover:text-gray-400">About</a>
    </nav>

    <div class="flex gap-4 items-center">
      <button id="themeToggle" class="text-xl">🌙</button>
      <button id="menuBtn" class="md:hidden text-3xl">☰</button>
    </div>

  </div>

  
  <div id="mobileMenu" class="hidden md:hidden bg-zinc-950 px-6 py-4 flex flex-col gap-4">
    <a href="index.html">Home</a>
    <a href="favorite.html">Favorite</a>
    <a href="about.html">About</a>
  </div>
</header>


<section class="text-center py-16 px-6">
  <h2 class="text-4xl md:text-6xl font-bold mb-4">
    Find Your Next Book
  </h2>

  <p class="text-gray-400 mb-6">
    Search books and save favorites
  </p>

  <div class="flex flex-col md:flex-row gap-4 max-w-xl mx-auto">
    <input
      id="searchInput"
      class="flex-1 p-3 bg-zinc-800 text-white rounded"
      placeholder="Search books..."
    />

    <button
      id="searchBtn"
      class="bg-white text-black px-6 py-3 font-bold rounded"
    >
      Search
    </button>
  </div>
</section>


<div id="loading" class="hidden text-center text-gray-400">
  Loading...
</div>


<main class="flex-1 max-w-7xl mx-auto px-6 pb-20 w-full">

  <div
    id="booksContainer"
    class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6"
  ></div>

  <p id="noResults" class="hidden text-center text-gray-400">
    No books found
  </p>

</main>


<footer class="bg-zinc-900 text-center py-6 text-gray-400 mt-auto">
  © 2026 Book Explorer
</footer>


<script type="module" src="./javascript/app.js"></script>

</body>
</html>
